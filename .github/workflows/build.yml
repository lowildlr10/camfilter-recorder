name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Windows  —  NSIS setup installer (fast startup, split DLLs)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows-installer:
    name: Windows NSIS Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (--onedir for fast startup)
        run: |
          pyinstaller `
            --onedir `
            --windowed `
            --name "CamFilterRecorder" `
            main.py

      - name: Write LICENSE for NSIS
        run: copy LICENSE.txt packaging\LICENSE.txt
        shell: cmd

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        run: |
          cd packaging
          makensis installer.nsi

      - name: Move installer to dist
        run: move packaging\CamFilterRecorder-Setup.exe dist\CamFilterRecorder-Setup.exe
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamFilterRecorder-windows-installer
          path: dist/CamFilterRecorder-Setup.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CamFilterRecorder-Setup.exe

  # ────────────────────────────────────────────────────────────────────────────
  # Fedora  —  RPM
  # ────────────────────────────────────────────────────────────────────────────
  build-fedora-rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          dnf install -y \
            python3-pip python3-devel \
            mesa-libGL glib2 \
            rpm-build rpmdevtools \
            gcc gcc-c++ make \
            libxcb xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm \
            libxkbcommon

      - name: Install Python dependencies
        run: |
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Build standalone binary with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name "CamFilterRecorder" \
            main.py

      - name: Set up RPM build tree
        run: rpmdev-setuptree

      - name: Copy files into RPM build tree
        run: |
          cp dist/CamFilterRecorder ~/rpmbuild/BUILD/
          cp packaging/camfilter-recorder.desktop ~/rpmbuild/BUILD/
          cp packaging/CamFilterRecorder.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: rpmbuild -bb ~/rpmbuild/SPECS/CamFilterRecorder.spec

      - name: Collect RPM
        run: |
          mkdir -p dist
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamFilterRecorder-fedora-rpm
          path: dist/*.rpm

      - name: Attach RPM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm

  # ────────────────────────────────────────────────────────────────────────────
  # Ubuntu / Debian  —  DEB
  # ────────────────────────────────────────────────────────────────────────────
  build-ubuntu-deb:
    name: Ubuntu / Debian DEB
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1 libglib2.0-0 \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone binary with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name "CamFilterRecorder" \
            main.py

      - name: Assemble DEB package tree
        run: |
          mkdir -p deb-pkg/usr/local/bin
          mkdir -p deb-pkg/usr/share/applications
          cp dist/CamFilterRecorder deb-pkg/usr/local/bin/CamFilterRecorder
          chmod 755 deb-pkg/usr/local/bin/CamFilterRecorder
          cp packaging/camfilter-recorder.desktop deb-pkg/usr/share/applications/
          cp -r packaging/deb/DEBIAN deb-pkg/DEBIAN
          chmod 755 deb-pkg/DEBIAN

      - name: Build DEB
        run: dpkg-deb --build deb-pkg dist/camfilter-recorder_1.1.0_amd64.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamFilterRecorder-ubuntu-deb
          path: dist/*.deb

      - name: Attach DEB to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb

  # ────────────────────────────────────────────────────────────────────────────
  # macOS  —  zip
  # ────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Build .app bundle
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "CamFilterRecorder" \
            main.py

      - name: Zip app for upload
        run: |
          cd dist
          zip -r CamFilterRecorder-macos.zip CamFilterRecorder

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamFilterRecorder-macos
          path: dist/CamFilterRecorder-macos.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CamFilterRecorder-macos.zip
